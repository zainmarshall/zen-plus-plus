<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZEN++ Playground</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div class="page">
      <header class="toolbar">
        <span class="logo">ZEN++</span>
        <button id="run" class="btn">Run</button>
      </header>

      <main class="ide">
        <section class="panel panel--code">
          <div class="panel__header"><span>Program</span></div>
          <div class="code-shell">
            <pre id="source-highlight" class="code-highlight"></pre>
            <textarea id="source" class="code-input" spellcheck="false"></textarea>
          </div>
        </section>

        <div class="side">
          <section class="panel panel--io">
            <div class="panel__header">
              <span>Input</span>
              <button id="clear" class="btn ghost">Clear</button>
            </div>
            <textarea id="stdin" spellcheck="false"></textarea>
          </section>

          <section class="panel panel--io">
            <div class="panel__header"><span>Output</span></div>
            <pre id="stdout" class="output"></pre>
          </section>
        </div>
      </main>
    </div>

    <script src="zenpp.js"></script>
    <script src="app.js"></script>
  </body>
</html>
