<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zen++ Interpreter</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
  </head>
  <body>
    <div class="page">

      <header class="toolbar">
        <span class="logo">Zen++ Interpreter</span>
        <div class="toolbar-links">
          <a href="https://github.com/zainmarshall/zen-plus-plus#installation" target="_blank" class="btn docs-btn">Install Locally</a>
          <a href="https://github.com/zainmarshall/zen-plus-plus/blob/master/docs/language-reference.md" target="_blank" class="btn docs-btn">Docs</a>
          <button id="settings-btn" class="settings-btn" title="Settings" aria-label="Settings">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <div id="settings-popup" class="settings-popup">
            <div class="settings-title">Theme</div>
            <div class="theme-list" id="theme-list"></div>
          </div>
        </div>
      </header>

      <main class="ide">
        <section class="panel panel--code">
          <div class="panel__header">
            <div class="header-left">
              <span>Program</span>
              <select id="samples" class="sample-select" title="Load a sample program">
                <option value="">Samples</option>
              </select>
            </div>
            <button id="run" class="btn play" title="Run program (Ctrl+Enter)" aria-label="Run program">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M3 1.5 L12 7 L3 12.5 Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
              </svg>
              <span class="sr-only">Run</span>
            </button>
          </div>
          <div class="code-shell">
            <div class="line-numbers" id="line-numbers"></div>
            <div class="code-area">
              <pre id="source-highlight" class="code-highlight"></pre>
              <textarea id="source" class="code-input" spellcheck="false"></textarea>
              <div id="autocomplete" class="autocomplete"></div>
            </div>
          </div>
        </section>

        <div class="side">
          <section class="panel panel--io">
            <div class="panel__header">
              <span>Input</span>
              <button id="clear" class="btn ghost">Clear</button>
            </div>
            <textarea id="stdin" spellcheck="false"></textarea>
          </section>

          <section class="panel panel--io">
            <div class="panel__header"><span>Output</span></div>
            <pre id="stdout" class="output"></pre>
          </section>
        </div>
      </main>
    </div>

    <script src="zenpp.js"></script>
    <script src="app.js"></script>
  </body>
</html>
